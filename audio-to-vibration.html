<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>音频转震动 v7.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:16px;-webkit-tap-highlight-color:transparent}
h1{font-size:1.4em;margin-bottom:2px;color:#fff}
.sub{font-size:.78em;color:#666;margin-bottom:16px}
.card{background:#141414;border:1px solid #222;border-radius:14px;padding:20px;width:100%;max-width:520px;margin-bottom:12px}
.drop-zone{border:2px dashed #333;border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer;transition:all .2s;touch-action:manipulation}
.drop-zone:active,.drop-zone.dragover{border-color:#4a9eff;background:rgba(74,158,255,.05)}
.drop-zone .icon{font-size:2em;margin-bottom:6px}
.drop-zone p{color:#777;font-size:.82em}
.drop-zone .filename{color:#4a9eff;margin-top:6px;font-weight:600;font-size:.85em;word-break:break-all}
.row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.row label{font-size:.75em;color:#777;display:block;margin-bottom:3px}
.row select{width:100%;background:#1c1c1c;border:1px solid #2a2a2a;color:#e0e0e0;border-radius:8px;padding:7px 8px;font-size:.82em;-webkit-appearance:none}
.row input[type=range]{width:100%;padding:0;height:4px;-webkit-appearance:none;appearance:none;background:#2a2a2a;border-radius:2px;outline:none;margin-top:8px}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#4a9eff;cursor:pointer}
.param{flex:1;min-width:110px}
.btn{background:#4a9eff;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:.95em;font-weight:600;cursor:pointer;transition:all .15s;width:100%;touch-action:manipulation}
.btn:active{transform:scale(.97);background:#3a8eef}
.btn:disabled{background:#222;color:#555;cursor:default;transform:none}
.progress{display:none;margin-top:12px}
.progress-bar{background:#1c1c1c;border-radius:3px;height:4px;overflow:hidden}
.progress-fill{background:#4a9eff;height:100%;width:0;transition:width .3s;border-radius:3px}
.progress-text{font-size:.75em;color:#666;margin-top:5px;text-align:center}
.result{display:none}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px}
.stat{background:#1a1a1a;border-radius:10px;padding:10px 6px;text-align:center}
.stat .num{font-size:1.3em;font-weight:700}
.stat .lbl{font-size:.65em;color:#666;margin-top:2px}
.stat.kick .num{color:#ff6b6b}
.stat.snare .num{color:#ffd93d}
.stat.hihat .num{color:#6bcb77}
.waveform{background:#111;border-radius:10px;overflow:hidden;height:70px;position:relative;margin-bottom:12px}
.waveform canvas{width:100%;height:100%;display:block}
.meta{text-align:center;margin-bottom:14px;font-size:.78em;color:#666}
.meta strong{color:#ccc}
.actions{display:flex;gap:8px}
.actions .btn{flex:1;font-size:.85em;padding:10px 12px}
.actions .sec{background:#222;color:#ccc}
.actions .sec:active{background:#333}
.footer{font-size:.65em;color:#333;margin-top:14px;text-align:center}
</style>
</head>
<body>
<h1>🎵 音频转震动</h1>
<p class="sub">频率感知律动 · 底鼓深震 / 军鼓利落 / hihat轻点</p>
<div class="card">
<div class="drop-zone" id="dropZone">
<div class="icon">📂</div>
<p>点击选择音频或视频文件</p>
<p style="font-size:.7em;color:#444;margin-top:2px">音频 / 视频均可 · MP3 WAV M4A MP4 MOV</p>
<div class="filename" id="fileName"></div>
</div>
<input type="file" id="fileInput" accept=".mp3,.wav,.m4a,.flac,.aac,.ogg,.mp4,.caf,.aiff,.wma,.mov,.avi,.mkv,.webm,.3gp,.m4v,audio/*,video/*,*/*" style="display:none">
</div>
<div class="card">
<div class="row">
<div class="param"><label>模式</label><select id="mode"><option value="auto">自动检测</option><option value="music">强制音乐</option><option value="speech">强制语音</option></select></div>
<div class="param"><label>灵敏度 <span id="threshVal">-30</span>dB</label><input type="range" id="threshold" min="-60" max="0" value="-30" step="1"></div>
</div>
<div class="row">
<div class="param"><label>基础脉冲 <span id="pulseVal">60</span>ms</label><input type="range" id="pulse" min="30" max="120" value="60" step="5"></div>
<div class="param"><label>强度</label><select id="intensity"><option value="dynamic">动态映射</option><option value="1.0">100%</option><option value="0.8">80%</option><option value="0.6">60%</option></select></div>
</div>
<button class="btn" id="convertBtn" disabled>开始转换</button>
</div>
<div class="progress" id="progress">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-text" id="progressText">准备中...</div>
</div>
<div class="result" id="result">
<div class="card">
<div class="waveform"><canvas id="waveCanvas"></canvas></div>
<div class="stats">
<div class="stat kick"><div class="num" id="kickCount">0</div><div class="lbl">🥁 底鼓</div></div>
<div class="stat snare"><div class="num" id="snareCount">0</div><div class="lbl">🪘 军鼓</div></div>
<div class="stat hihat"><div class="num" id="hihatCount">0</div><div class="lbl">💿 hihat</div></div>
</div>
<div class="meta">BPM ≈ <strong id="bpmVal">0</strong><span style="margin:0 8px;color:#2a2a2a">|</span>震动 <strong id="totalVib">0</strong><span style="margin:0 8px;color:#2a2a2a">|</span>占比 <strong id="ratioVal">0%</strong></div>
<div class="actions">
<button class="btn sec" id="previewBtn">▶ 预览</button>
<button class="btn" id="downloadBtn">下载 plist</button>
</div>
</div>
</div>
<div class="footer">v7.0 · 纯浏览器运行 · 无需终端 · 无需安装</div>
<script>
// Butterworth 2阶滤波器系数
function butterCoeff(cutoffHz,sr,type){const nyq=sr/2,W=Math.min(cutoffHz/nyq,.99),ita=Math.tan(Math.PI*W/2),q=Math.SQRT2;let b0,b1,b2,a1,a2;if(type==='lowpass'){b0=1/(1+q*ita+ita*ita);b1=2*b0;b2=b0;a1=2*(1-ita*ita)*b0;a2=(1-q*ita+ita*ita)*b0}else{b0=ita*ita/(1+q*ita+ita*ita);b1=-2*b0;b2=b0;a1=2*(ita*ita-1)/(1+q*ita+ita*ita);a2=(1-q*ita+ita*ita)/(1+q*ita+ita*ita)}return{b:[b0,b1,b2],a:[1,a1,a2]}}

// IIR滤波
function iir(data,c){const n=data.length,out=new Float32Array(n);let x1=0,x2=0,y1=0,y2=0;for(let i=0;i<n;i++){const x0=data[i],y0=c.b[0]*x0+c.b[1]*x1+c.b[2]*x2-c.a[1]*y1-c.a[2]*y2;out[i]=y0;x2=x1;x1=x0;y2=y1;y1=y0}return out}

// 级联滤波
function iirN(data,c,passes){let d=data;for(let i=0;i<passes;i++)d=iir(d,c);return d}

// RMS能量包络
function rmsEnv(data,fs,hs){const nf=Math.floor((data.length-fs)/hs)+1,e=new Float32Array(nf);for(let i=0;i<nf;i++){let s=0;const o=i*hs;for(let j=0;j<fs;j++){const v=data[o+j]||0;s+=v*v}e[i]=Math.sqrt(s/fs)}return e}

// 归一化到0-1
function norm(a){let m=0;for(let i=0;i<a.length;i++)if(a[i]>m)m=a[i];if(m>0)for(let i=0;i<a.length;i++)a[i]/=m;return a}

// Onset检测(spectral flux + 自适应阈值)
function onsets(env,wf,delta){const fl=new Float32Array(env.length);let mf=0;for(let i=1;i<env.length;i++){fl[i]=Math.max(0,env[i]-env[i-1]);if(fl[i]>mf)mf=fl[i]}if(mf===0)return[];const th=new Float32Array(env.length),win=20;for(let i=0;i<env.length;i++){const lo=Math.max(0,i-win),hi=Math.min(env.length,i+win+1);let s=0;for(let j=lo;j<hi;j++)s+=fl[j];th[i]=s/(hi-lo)+delta*mf}const r=[];let last=-wf;for(let i=1;i<env.length-1;i++){if(fl[i]>th[i]&&fl[i]>=fl[i-1]&&fl[i]>=fl[i+1]&&i-last>=wf){r.push(i);last=i}}return r}

// BPM检测(自相关)
function detectBPM(env,hs,sr){const esr=sr/hs,ml=Math.floor(esr*60/250),xl=Math.floor(esr*60/40),len=Math.min(env.length-xl,2000);if(len<=0)return 120;let bl=ml,bc=-Infinity;for(let lag=ml;lag<=xl;lag++){let c=0;for(let i=0;i<len;i++)c+=env[i]*env[i+lag];if(c>bc){bc=c;bl=lag}}return Math.round(60*esr/bl)}

// 按能量限制onset数量
function limitOnsets(ons,env,mx){if(ons.length<=mx)return ons;const sc=ons.map(f=>({f,e:env[f]}));sc.sort((a,b)=>b.e-a.e);const k=new Set(sc.slice(0,mx).map(s=>s.f));return ons.filter(f=>k.has(f))}

// ===== 频率感知律动 =====
function groove(ad,sr,tdb,pm){
  const tm=Math.floor(ad.length/sr*1000),fs=2048,hs=512,hm=hs/sr*1000;
  const fe=norm(rmsEnv(ad,fs,hs)),bp=detectBPM(fe,hs,sr),ne=Math.max(10,Math.floor(tm/1000*bp/60));
  // 分频段滤波
  const aL=iirN(ad,butterCoeff(200,sr,'lowpass'),3);
  const mt=iirN(ad,butterCoeff(200,sr,'highpass'),3);
  const aM=iirN(mt,butterCoeff(3000,sr,'lowpass'),3);
  const aH=iirN(ad,butterCoeff(3000,sr,'highpass'),3);
  // 包络
  const eL=norm(rmsEnv(aL,fs,hs)),eM=norm(rmsEnv(aM,fs,hs)),eH=norm(rmsEnv(aH,fs,hs));
  // Onset
  const oL=limitOnsets(onsets(eL,15,.25),eL,Math.max(20,Math.floor(ne*1.1)));
  const oM=limitOnsets(onsets(eM,8,.2),eM,Math.max(15,Math.floor(ne*.6)));
  const oH=limitOnsets(onsets(eH,6,.15),eH,Math.max(30,Math.floor(ne*.8)));
  // 事件
  let raw=[];
  for(const f of oL){const e=Math.min(1,Math.max(.1,eL[f]));if(e>.15)raw.push({p:f*hm,s:e,t:'kick'})}
  for(const f of oM){const e=Math.min(1,Math.max(.1,eM[f]));if(e>.15)raw.push({p:f*hm,s:e,t:'snare'})}
  for(const f of oH){const e=Math.min(1,Math.max(.1,eH[f]));if(e>.1)raw.push({p:f*hm,s:e,t:'hihat'})}
  raw.sort((a,b)=>a.p-b.p);
  // 合并
  const G={'kick-kick':80,'kick-snare':50,'kick-hihat':40,'snare-kick':50,'snare-snare':60,'snare-hihat':35,'hihat-kick':40,'hihat-snare':35,'hihat-hihat':70},P={kick:3,snare:2,hihat:1};
  const fl=[];
  for(const e of raw){if(!fl.length){fl.push(e);continue}const pr=fl[fl.length-1],g=e.p-pr.p,mg=G[pr.t+'-'+e.t]||40;if(g<mg){if(P[e.t]>P[pr.t])fl[fl.length-1]=e;else if(P[e.t]===P[pr.t]&&e.s>pr.s)fl[fl.length-1]=e}else fl.push(e)}
  // 映射震动
  const evs=[],sts=[];let cur=0,nk=0,ns=0,nh=0;
  for(const e of fl){
    if(e.p>=tm)break;
    if(e.p>cur){const g=e.p-cur;if(g>=3)evs.push({v:false,m:g});else continue}
    let d,ms;
    if(e.t==='kick'){d=Math.max(80,Math.min(150,Math.floor(80+70*e.s)));ms=e.s;nk++}
    else if(e.t==='snare'){d=Math.max(30,Math.min(70,Math.floor(30+40*e.s)));ms=e.s*.7;ns++}
    else{d=Math.max(10,Math.min(25,Math.floor(10+15*e.s)));ms=e.s*.35;nh++}
    evs.push({v:true,m:d});sts.push(ms);cur=e.p+d;
  }
  if(cur<tm)evs.push({v:false,m:tm-cur});
  return{events:evs,strengths:sts,bpm:bp,info:{kick:nk,snare:ns,hihat:nh}}
}

// ===== 语音模式 =====
function speech(ad,sr,tdb,pm){
  const tm=Math.floor(ad.length/sr*1000),fs=2048,hs=512,hm=hs/sr*1000;
  const e=norm(rmsEnv(ad,fs,hs)),o=onsets(e,5,.05),th=Math.pow(10,tdb/20);
  const evs=[],sts=[];let cur=0;
  for(const f of o){const s=e[f];if(s<th)continue;const p=f*hm;if(p>cur){const g=p-cur;if(g>=3)evs.push({v:false,m:g});else continue}const d=Math.max(20,Math.floor(pm*(.3+.7*s)));evs.push({v:true,m:d});sts.push(s);cur=p+d}
  if(cur<tm)evs.push({v:false,m:tm-cur});
  return{events:evs,strengths:sts,bpm:0,info:{syllables:evs.filter(e=>e.v).length}}
}

// ===== plist =====
function mkPlist(evs,sts,name,im){
  const uid=crypto.randomUUID().toUpperCase(),dyn=im==='dynamic';
  let iv=1;if(!dyn)iv=parseFloat(im);
  // Intensity: 动态模式取均值，固定模式用设定值
  let intensityVal;
  if(dyn&&sts.length>0){intensityVal=Math.round(sts.reduce((a,b)=>a+b,0)/sts.length*100)/100}else{intensityVal=iv}
  // 构建VibePattern: true/false均可开头，最小时长1ms
  const vp=[];
  for(const e of evs){
    const dur=Math.max(1,Math.round(e.m));
    vp.push(e.v?'      <true />':'      <false />');
    vp.push('      <integer>'+dur+'</integer>');
  }
  // 结构: usergeneratedvibration:UUID 作为key，值为嵌套dict（与Python版一致）
  return '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>usergeneratedvibration:'+uid+'</key>\n  <dict>\n    <key>Name</key>\n    <string>'+name+'</string>\n    <key>Pattern</key>\n    <dict>\n      <key>Intensity</key>\n      <real>'+intensityVal+'</real>\n      <key>VibePattern</key>\n      <array>\n'+vp.join('\n')+'\n      </array>\n    </dict>\n  </dict>\n</dict>\n</plist>';
}

// ===== UI =====
let ab=null,lr=null,afn='';
const dz=document.getElementById('dropZone'),fi=document.getElementById('fileInput'),cb=document.getElementById('convertBtn');
// iOS兼容：touchend + click双保险触发文件选择
let fileInputReady=false;
dz.addEventListener('click',e=>{e.preventDefault();fi.click()});
dz.addEventListener('touchend',e=>{e.preventDefault();if(!fileInputReady){fileInputReady=true;fi.click();setTimeout(()=>{fileInputReady=false},300)}});
dz.ondragover=e=>{e.preventDefault();dz.classList.add('dragover')};
dz.ondragleave=()=>dz.classList.remove('dragover');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('dragover');if(e.dataTransfer.files.length)hf(e.dataTransfer.files[0])};
fi.onchange=e=>{if(e.target.files.length)hf(e.target.files[0])};
document.getElementById('threshold').oninput=e=>{document.getElementById('threshVal').textContent=e.target.value};
document.getElementById('pulse').oninput=e=>{document.getElementById('pulseVal').textContent=e.target.value};

async function hf(file){
  afn=file.name.replace(/\.[^.]+$/,'');
  const isVideo=file.type.startsWith('video/');
  document.getElementById('fileName').textContent=file.name+(isVideo?' (提取音频中...)':'');
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  try{
    const buf=await file.arrayBuffer();
    ab=await ctx.decodeAudioData(buf);
    cb.disabled=false;
    const dur=(ab.duration).toFixed(1);
    document.getElementById('fileName').textContent=file.name+' ('+dur+'s)';
  }
  catch(e){alert('无法解码: '+e.message+'\n支持的格式: MP3/WAV/M4A/MP4/MOV等');ab=null;cb.disabled=true}
  ctx.close();
}

cb.onclick=async()=>{
  if(!ab)return;cb.disabled=true;
  const pg=document.getElementById('progress'),fl=document.getElementById('progressFill'),pt=document.getElementById('progressText');
  pg.style.display='block';document.getElementById('result').style.display='none';
  const tdb=parseInt(document.getElementById('threshold').value),pm=parseInt(document.getElementById('pulse').value);
  const md=document.getElementById('mode').value,im=document.getElementById('intensity').value;
  const d=ab.getChannelData(0),sr=ab.sampleRate;
  fl.style.width='15%';pt.textContent='提取音频中...';await new Promise(r=>setTimeout(r,30));
  fl.style.width='40%';pt.textContent='频段分离...';await new Promise(r=>setTimeout(r,30));
  let res;if(md==='speech')res=speech(d,sr,tdb,pm);else res=groove(d,sr,tdb,pm);
  fl.style.width='80%';pt.textContent='生成震动模式...';await new Promise(r=>setTimeout(r,30));
  const plist=mkPlist(res.events,res.strengths,afn||'Vibration',im);
  const tm=Math.floor(d.length/sr*1000);
  lr={plist,events:res.events,info:res.info,bpm:res.bpm,totalMs:tm};
  fl.style.width='100%';pt.textContent='完成!';await new Promise(r=>setTimeout(r,200));
  pg.style.display='none';document.getElementById('result').style.display='block';cb.disabled=false;
  document.getElementById('kickCount').textContent=res.info.kick||0;
  document.getElementById('snareCount').textContent=res.info.snare||0;
  document.getElementById('hihatCount').textContent=res.info.hihat||0;
  document.getElementById('bpmVal').textContent=res.bpm;
  const tv=res.events.filter(e=>e.v).length,vm=res.events.filter(e=>e.v).reduce((s,e)=>s+e.m,0);
  document.getElementById('totalVib').textContent=tv;
  document.getElementById('ratioVal').textContent=Math.round(vm/tm*100)+'%';
  drawWf(d,res.events,sr);
};

function drawWf(data,events,sr){
  const cv=document.getElementById('waveCanvas'),dpr=window.devicePixelRatio||1,rc=cv.parentElement.getBoundingClientRect();
  cv.width=rc.width*dpr;cv.height=rc.height*dpr;
  const c=cv.getContext('2d');c.scale(dpr,dpr);
  const W=rc.width,H=rc.height;
  c.fillStyle='#111';c.fillRect(0,0,W,H);
  const st=Math.max(1,Math.floor(data.length/W));
  c.strokeStyle='#2a2a2a';c.lineWidth=1;c.beginPath();
  for(let x=0;x<W;x++){const v=data[x*st]||0,y=H/2-v*H*.4;x===0?c.moveTo(x,y):c.lineTo(x,y)}
  c.stroke();
  const tm=Math.floor(data.length/sr*1000);let cur=0;
  for(const e of events){
    const x=(cur/tm)*W,w=Math.max(1,(e.m/tm)*W);
    if(e.v){c.fillStyle=e.m>=80?'rgba(255,107,107,0.5)':e.m>=30?'rgba(255,217,61,0.4)':'rgba(107,203,119,0.35)';c.fillRect(x,0,w,H)}
    cur+=e.m;
  }
}

document.getElementById('downloadBtn').onclick=()=>{
  if(!lr)return;
  const b=new Blob([lr.plist],{type:'application/xml'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=(afn||'vibration')+'.plist';a.click();URL.revokeObjectURL(u);
};

document.getElementById('previewBtn').onclick=()=>{
  if(!lr||!navigator.vibrate){alert('当前浏览器不支持震动预览');return}
  let c=0;const p=[];
  for(const e of lr.events){if(c>=5000)break;p.push(e.m);c+=e.m}
  navigator.vibrate(p);
};
</script>
</body>
</html>
